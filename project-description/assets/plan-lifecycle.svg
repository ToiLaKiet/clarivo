<svg xmlns="http://www.w3.org/2000/svg" width="960" height="315" viewBox="0 0 960 315" role="img" aria-labelledby="title desc">
  <title id="title">Plan lifecycle and approval boundary</title><desc id="desc">A plan moves from Clarifying to Draft to Awaiting manager review to Approved. Revisions can return it to drafting; approved plans remain immutable baselines while changes create a new version.</desc>
  <defs><style>.bg{fill:#f8fafc}.node{stroke-width:2}.n1{fill:#e0f2fe;stroke:#0284c7}.n2{fill:#ede9fe;stroke:#7c3aed}.n3{fill:#fef3c7;stroke:#d97706}.n4{fill:#dcfce7;stroke:#16a34a}.n5{fill:#fff7ed;stroke:#ea580c}.title{font:700 28px Arial,sans-serif;fill:#0f172a}.label{font:700 18px Arial,sans-serif;fill:#0f172a}.small{font:14px Arial,sans-serif;fill:#475569}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}.revision{stroke:#ea580c;stroke-width:3;fill:none;stroke-dasharray:8 6;marker-end:url(#o)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/></marker></defs>
  <g transform="scale(0.75)"><rect class="bg" width="1280" height="420" rx="24"/><text x="40" y="50" class="title">Plan lifecycle and approval boundary</text><rect x="55" y="120" width="200" height="90" rx="16" class="node n1"/><text x="155" y="155" text-anchor="middle" class="label">Clarifying</text><text x="155" y="180" text-anchor="middle" class="small">Questions + evidence</text><rect x="335" y="120" width="200" height="90" rx="16" class="node n2"/><text x="435" y="155" text-anchor="middle" class="label">Draft</text><text x="435" y="180" text-anchor="middle" class="small">Proposed plan</text><rect x="615" y="120" width="240" height="90" rx="16" class="node n3"/><text x="735" y="155" text-anchor="middle" class="label">Awaiting review</text><text x="735" y="180" text-anchor="middle" class="small">Manager decision required</text><rect x="935" y="120" width="240" height="90" rx="16" class="node n4"/><text x="1055" y="155" text-anchor="middle" class="label">Approved vN</text><text x="1055" y="180" text-anchor="middle" class="small">Published commitment</text><path d="M255 165 H335" class="arrow"/><path d="M535 165 H615" class="arrow"/><path d="M855 165 H935" class="arrow"/><path d="M735 210 C735 300 435 300 435 210" class="revision"/><text x="550" y="285" class="small">Manager requests revision</text><rect x="935" y="300" width="240" height="70" rx="16" class="node n5"/><text x="1055" y="329" text-anchor="middle" class="label">Change request vN+1</text><text x="1055" y="351" text-anchor="middle" class="small">Baseline vN stays active</text><path d="M1055 210 V300" class="revision"/><path d="M935 335 C820 335 820 235 735 210" class="revision"/><text x="55" y="365" class="small">Preliminary plans may be visible, but must be labeled unapproved.</text></g>
</svg>
