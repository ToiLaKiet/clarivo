<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLARVIO delivery workflow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px;background:#f5f5f5;color:#2d3142;font-family:'Geist',system-ui,sans-serif}
    main{width:100%;max-width:960px;min-width:0}
    .eyebrow{margin:0 0 8px;color:#4f5d75;font:500 11px 'Geist Mono',monospace;letter-spacing:.14em;text-transform:uppercase}
    h1{margin:0 0 20px;font:400 32px/1.1 'Instrument Serif',serif}
    .diagram-container{width:100%;overflow-x:auto}
    svg{display:block;width:100%;min-width:960px}
    @media print{.diagram-container{overflow-x:visible}svg{min-width:0}}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Project overview · How CLARVIO works</p>
    <h1>From a customer request to an approved plan</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="delivery-workflow-title delivery-workflow-desc">
        <title id="delivery-workflow-title">CLARVIO delivery workflow</title>
        <desc id="delivery-workflow-desc">Eight actions in three phases take a customer request through clarification, manager-approved planning, publication, and controlled changes.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="960" height="600" fill="#f5f5f5"/>
        <text x="40" y="62" fill="#2d3142" font-family="'Instrument Serif',serif" font-size="28">How CLARVIO turns a request into a commitment</text>
        <text x="40" y="88" fill="#4f5d75" font-family="'Geist',sans-serif" font-size="11">Read left to right. The manager approves every customer-visible commitment.</text>

        <!-- Three phases, then their connectors. -->
        <rect x="40" y="132" width="272" height="320" rx="8" fill="#ececec" fill-opacity=".42" stroke="#bfc0c0"/>
        <rect x="344" y="132" width="272" height="320" rx="8" fill="#ececec" fill-opacity=".42" stroke="#bfc0c0"/>
        <rect x="648" y="132" width="272" height="320" rx="8" fill="#ececec" fill-opacity=".42" stroke="#bfc0c0"/>
        <line x1="312" y1="292" x2="344" y2="292" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
        <line x1="616" y1="292" x2="648" y2="292" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>

        <!-- Phase headings -->
        <text x="60" y="164" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8" letter-spacing=".12em">PHASE 1 · CUSTOMER + AGENT</text>
        <text x="60" y="188" fill="#2d3142" font-family="'Geist',sans-serif" font-size="14" font-weight="600">Understand the request</text>
        <text x="364" y="164" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8" letter-spacing=".12em">PHASE 2 · AGENT + MANAGER</text>
        <text x="364" y="188" fill="#2d3142" font-family="'Geist',sans-serif" font-size="14" font-weight="600">Build a reviewed plan</text>
        <text x="668" y="164" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8" letter-spacing=".12em">PHASE 3 · SYSTEM + CUSTOMER</text>
        <text x="668" y="188" fill="#2d3142" font-family="'Geist',sans-serif" font-size="14" font-weight="600">Commit and evolve</text>

        <!-- Step separators -->
        <g stroke="#bfc0c0" stroke-opacity=".65" stroke-width=".8">
          <line x1="60" y1="246" x2="292" y2="246"/><line x1="60" y1="306" x2="292" y2="306"/>
          <line x1="60" y1="366" x2="292" y2="366"/><line x1="364" y1="302" x2="596" y2="302"/>
          <line x1="668" y1="302" x2="900" y2="302"/>
        </g>

        <!-- Phase 1: four ordered customer/agent actions -->
        <g fill="#2d3142" font-family="'Geist',sans-serif">
          <text x="60" y="220" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9">01</text>
          <text x="88" y="220" font-size="12" font-weight="600">Explore services</text>
          <text x="88" y="236" fill="#4f5d75" font-size="10">Customer asks what is available</text>
          <text x="60" y="280" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9">02</text>
          <text x="88" y="280" font-size="12" font-weight="600">Upload the request</text>
          <text x="88" y="296" fill="#4f5d75" font-size="10">Paste text or add a text PDF</text>
          <text x="60" y="340" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9">03</text>
          <text x="88" y="340" font-size="12" font-weight="600">Clarify missing decisions</text>
          <text x="88" y="356" fill="#4f5d75" font-size="10">Agent asks focused questions</text>
          <text x="60" y="400" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9">04</text>
          <text x="88" y="400" font-size="12" font-weight="600">Confirm scope</text>
          <text x="88" y="416" fill="#4f5d75" font-size="10">Customer checks deliverables and limits</text>
        </g>

        <!-- Phase 2: proposal and human decision -->
        <g fill="#2d3142" font-family="'Geist',sans-serif">
          <text x="364" y="228" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9">05</text>
          <text x="392" y="228" font-size="12" font-weight="600">Draft the plan</text>
          <text x="392" y="248" fill="#4f5d75" font-size="10">Tasks, owners, effort, milestones</text>
          <text x="392" y="264" fill="#4f5d75" font-size="10">and capacity-based dates</text>
        </g>
        <rect x="360" y="320" width="240" height="100" rx="6" fill="#f5f5f5"/>
        <rect x="360" y="320" width="240" height="100" rx="6" fill="rgba(191,69,32,.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="376" y="344" fill="#bf4520" font-family="'Geist Mono',monospace" font-size="9">06 · MANAGER GATE</text>
        <text x="376" y="366" fill="#2d3142" font-family="'Geist',sans-serif" font-size="12" font-weight="600">Review and approve</text>
        <text x="376" y="386" fill="#4f5d75" font-family="'Geist',sans-serif" font-size="10">Edit scope, effort, owners, and dates</text>
        <text x="376" y="402" fill="#4f5d75" font-family="'Geist',sans-serif" font-size="10">or send blockers to clarification</text>

        <!-- Phase 3: published output and later change -->
        <rect x="664" y="204" width="240" height="84" rx="6" fill="#f5f5f5"/>
        <rect x="664" y="204" width="240" height="84" rx="6" fill="rgba(191,69,32,.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="680" y="228" fill="#bf4520" font-family="'Geist Mono',monospace" font-size="9">07 · APPROVED OUTPUT</text>
        <text x="680" y="250" fill="#2d3142" font-family="'Geist',sans-serif" font-size="12" font-weight="600">Publish the commitment</text>
        <text x="680" y="270" fill="#4f5d75" font-family="'Geist',sans-serif" font-size="10">Plan, dates, and conditions</text>
        <text x="668" y="340" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9">08</text>
        <text x="696" y="340" fill="#2d3142" font-family="'Geist',sans-serif" font-size="12" font-weight="600">Handle a change request</text>
        <text x="696" y="360" fill="#4f5d75" font-family="'Geist',sans-serif" font-size="10">New needs start a revised plan</text>
        <text x="696" y="376" fill="#4f5d75" font-family="'Geist',sans-serif" font-size="10">for manager approval</text>

        <line x1="40" y1="492" x2="920" y2="492" stroke="#bfc0c0" stroke-width=".8"/>
        <text x="40" y="520" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8" letter-spacing=".1em">CONTROL RULE</text>
        <text x="40" y="544" fill="#2d3142" font-family="'Geist',sans-serif" font-size="11">Only the manager-approved version is a customer-visible commitment.</text>
        <text x="40" y="562" fill="#4f5d75" font-family="'Geist',sans-serif" font-size="10">A later request creates a new proposal; the approved baseline stays active until the revision is approved.</text>
      </svg>
    </div>
  </main>
</body>
</html>
