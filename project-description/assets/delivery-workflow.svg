<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">CLARVIO delivery workflow</title><desc id="desc">From customer exploration and requirement upload through clarification, scope confirmation, planning, manager review, approval, and controlled change requests.</desc>
  <defs><style>.bg{fill:#f8fafc}.lane{fill:#fff;stroke:#cbd5e1;stroke-width:2}.customer{fill:#e0f2fe;stroke:#0284c7}.agent{fill:#ede9fe;stroke:#7c3aed}.manager{fill:#dcfce7;stroke:#16a34a}.change{fill:#fff7ed;stroke:#ea580c}.box{stroke-width:2}.label{font:600 18px Arial,sans-serif;fill:#0f172a}.small{font:14px Arial,sans-serif;fill:#475569}.laneLabel{font:700 20px Arial,sans-serif;fill:#334155}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}.loop{stroke:#ea580c;stroke-width:3;fill:none;stroke-dasharray:8 6;marker-end:url(#orangeArrow)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/></marker></defs>
  <g transform="scale(0.75)"><rect class="bg" width="1280" height="640" rx="24"/><text x="40" y="48" class="label" style="font-size:28px">From request to reviewed delivery commitment</text>
  <rect x="30" y="75" width="1220" height="135" rx="18" class="lane"/><text x="55" y="108" class="laneLabel">Customer</text><rect x="30" y="225" width="1220" height="160" rx="18" class="lane"/><text x="55" y="258" class="laneLabel">AI agent + scheduler</text><rect x="30" y="400" width="1220" height="135" rx="18" class="lane"/><text x="55" y="433" class="laneLabel">Manager</text>
  <rect x="140" y="115" width="170" height="65" rx="12" class="box customer"/><text x="225" y="142" text-anchor="middle" class="label">1. Explore</text><text x="225" y="164" text-anchor="middle" class="small">Ask about services</text><rect x="360" y="115" width="170" height="65" rx="12" class="box customer"/><text x="445" y="142" text-anchor="middle" class="label">2. Upload</text><text x="445" y="164" text-anchor="middle" class="small">Text or PDF</text><rect x="580" y="115" width="190" height="65" rx="12" class="box customer"/><text x="675" y="142" text-anchor="middle" class="label">4. Confirm scope</text><text x="675" y="164" text-anchor="middle" class="small">Accept criteria &amp; limits</text><rect x="930" y="115" width="230" height="65" rx="12" class="box customer"/><text x="1045" y="142" text-anchor="middle" class="label">7. Receive commitment</text><text x="1045" y="164" text-anchor="middle" class="small">Approved plan + conditions</text>
  <rect x="250" y="275" width="210" height="72" rx="12" class="box agent"/><text x="355" y="303" text-anchor="middle" class="label">3. Clarify</text><text x="355" y="325" text-anchor="middle" class="small">Resolve high-impact gaps</text><rect x="550" y="275" width="240" height="72" rx="12" class="box agent"/><text x="670" y="303" text-anchor="middle" class="label">5. Draft plan</text><text x="670" y="325" text-anchor="middle" class="small">Tasks, owners, effort, dates</text><rect x="880" y="275" width="250" height="72" rx="12" class="box change"/><text x="1005" y="303" text-anchor="middle" class="label">8. Change request</text><text x="1005" y="325" text-anchor="middle" class="small">Preserve approved baseline</text><rect x="535" y="445" width="270" height="65" rx="12" class="box manager"/><text x="670" y="472" text-anchor="middle" class="label">6. Review &amp; approve</text><text x="670" y="494" text-anchor="middle" class="small">Edit scope, owners, effort, dates</text>
  <path d="M310 148 H360" class="arrow"/><path d="M445 180 C445 225 355 225 355 275" class="arrow"/><path d="M460 311 C510 311 520 148 580 148" class="arrow"/><path d="M675 180 V275" class="arrow"/><path d="M670 347 V445" class="arrow"/><path d="M805 477 C880 477 880 148 930 148" class="arrow"/><path d="M535 477 C420 477 420 365 355 347" class="loop"/><text x="392" y="417" class="small" fill="#c2410c">Blocker / revision</text><path d="M1045 180 V275" class="loop"/><path d="M880 311 H790" class="loop"/><text x="40" y="588" class="small">Only manager-approved versions become customer-visible commitments. Later requests start a new revision.</text></g>
</svg>
