<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plan lifecycle and approval boundary</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--soft:#7b8499;--accent:#bf4520;--sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif',serif;--mono:'Geist Mono',ui-monospace,monospace}body{background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:100vh;padding:3rem 2rem;display:flex;align-items:center;justify-content:center}.frame{width:100%;max-width:1280px;min-width:0}.eyebrow{font:500 .66rem var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}h1{font:400 clamp(1.5rem,2.4vw + .75rem,2rem)/1.15 var(--serif);letter-spacing:-.02em;margin-bottom:1.5rem}.diagram-container{width:100%;overflow-x:auto}svg{width:100%;min-width:1280px;display:block}@media print{.diagram-container{overflow-x:visible}svg{min-width:0}}
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">State machine · Approval control</p>
    <h1>Plan lifecycle and approval boundary</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="plan-lifecycle-title plan-lifecycle-desc">
        <title id="plan-lifecycle-title">Plan lifecycle and approval boundary</title>
        <desc id="plan-lifecycle-desc">A plan moves from clarification through drafting and manager review to an immutable approved baseline, while revisions and changes create new draft versions.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="1280" height="720" fill="#f5f5f5"/>

        <!-- Approval boundary and connectors -->
        <rect x="760" y="76" width="480" height="480" rx="8" fill="rgba(191,69,32,.035)" stroke="rgba(191,69,32,.45)" stroke-dasharray="4 4"/>
        <text x="784" y="104" fill="#bf4520" font-family="'Geist Mono',monospace" font-size="8" font-weight="500" letter-spacing=".14em">MANAGER APPROVAL BOUNDARY</text>
        <g fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)">
          <path d="M76 264 H132"/>
          <path d="M340 264 H412"/>
          <path d="M620 264 H796"/>
        </g>
        <path d="M1004 264 H1072" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <g fill="none" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow-accent)">
          <path d="M900 312 V388 Q900 396 892 396 H524 Q516 396 516 388 V312"/>
          <path d="M1176 312 V440"/>
          <path d="M1072 484 H980 Q972 484 972 476 V328 Q972 320 964 320 H924"/>
        </g>
        <rect x="664" y="372" width="144" height="12" rx="2" fill="#f5f5f5"/><text x="736" y="381" text-anchor="middle" fill="#bf4520" font-family="'Geist Mono',monospace" font-size="8" letter-spacing=".06em">REVISION REQUESTED</text>
        <rect x="1000" y="460" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="1028" y="469" text-anchor="middle" fill="#bf4520" font-family="'Geist Mono',monospace" font-size="8" letter-spacing=".06em">REDRAFT</text>

        <!-- States -->
        <circle cx="68" cy="264" r="6" fill="#2d3142"/>
        <g text-anchor="middle" fill="#2d3142" font-family="'Geist',sans-serif">
          <g><rect x="132" y="216" width="208" height="96" rx="8" fill="#f5f5f5"/><rect x="132" y="216" width="208" height="96" rx="8" fill="rgba(79,93,117,.10)" stroke="#7b8499"/><text x="236" y="258" font-size="12" font-weight="600">Clarifying</text><text x="236" y="278" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9">questions + evidence</text></g>
          <g><rect x="412" y="216" width="208" height="96" rx="8" fill="#f5f5f5"/><rect x="412" y="216" width="208" height="96" rx="8" fill="#fff" stroke="#2d3142"/><text x="516" y="258" font-size="12" font-weight="600">Draft</text><text x="516" y="278" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9">proposed plan</text></g>
          <g><rect x="796" y="216" width="208" height="96" rx="8" fill="#f5f5f5"/><rect x="796" y="216" width="208" height="96" rx="8" fill="#fff" stroke="#2d3142"/><text x="900" y="258" font-size="12" font-weight="600">Awaiting review</text><text x="900" y="278" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9">manager decision required</text></g>
          <g><rect x="1072" y="216" width="168" height="96" rx="8" fill="#f5f5f5"/><rect x="1072" y="216" width="168" height="96" rx="8" fill="rgba(191,69,32,.08)" stroke="#bf4520" stroke-width="1.2"/><text x="1156" y="258" font-size="12" font-weight="600">Approved vN</text><text x="1156" y="278" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9">published baseline</text></g>
          <g><rect x="1072" y="440" width="168" height="88" rx="8" fill="#f5f5f5"/><rect x="1072" y="440" width="168" height="88" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.28)" stroke-dasharray="4 3"/><text x="1156" y="478" font-size="12" font-weight="600">Change vN+1</text><text x="1156" y="498" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9">vN stays active</text></g>
        </g>
        <circle cx="1216" cy="360" r="8" fill="none" stroke="#bf4520" stroke-width="1.2"/><circle cx="1216" cy="360" r="5" fill="#bf4520"/>

        <text x="132" y="156" fill="#2d3142" font-family="'Instrument Serif',serif" font-size="28" font-style="italic">Publication requires an accountable human decision.</text>
        <text x="132" y="184" fill="#4f5d75" font-family="'Geist',sans-serif" font-size="11">Preliminary plans may remain visible, but they are always marked unapproved.</text>

        <!-- Legend -->
        <line x1="40" y1="636" x2="1240" y2="636" stroke="rgba(45,49,66,.14)"/>
        <text x="40" y="660" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8" letter-spacing=".14em">LEGEND</text>
        <rect x="128" y="649" width="16" height="12" rx="2" fill="#fff" stroke="#2d3142"/><text x="152" y="659" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8">EDITABLE PLAN</text>
        <rect x="268" y="649" width="16" height="12" rx="2" fill="rgba(191,69,32,.08)" stroke="#bf4520"/><text x="292" y="659" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8">APPROVED BASELINE</text>
        <line x1="456" y1="655" x2="488" y2="655" stroke="#bf4520" stroke-dasharray="5 4"/><text x="500" y="659" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8">NEW VERSION PATH</text>
      </svg>
    </div>
  </main>
</body>
</html>
